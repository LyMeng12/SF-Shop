spring:
  application:
    name: API_SF-Shop

  datasource:
    url: jdbc:postgresql://localhost:5432/sf_shop
    username: Admin
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true